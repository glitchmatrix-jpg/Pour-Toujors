name: Android APK

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: APK build mode
        required: true
        default: both
        type: choice
        options: [debug, release, both]
  push:
    branches: [agent/initial-product-foundation]
    paths: ["lib/**", "assets/**", "android/**", "test/**", "pubspec.yaml", "pubspec.lock", "analysis_options.yaml", ".github/workflows/android-apk.yml"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable
  JAVA_VERSION: "17"

jobs:
  validate-and-build:
    name: Validate and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Generate Android platform when absent
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --org com.pourtoujours --project-name pour_toujours .
          fi
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in text:
              text = text.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + permission)
          manifest.write_text(text, encoding='utf-8')
          PY

      - name: Install Flutter packages
        run: flutter pub get

      - name: Format checked sources
        run: dart format lib test 2>/dev/null || dart format lib

      - name: Static analysis
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run tests when present
        shell: bash
        run: |
          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test --reporter expanded
          else
            echo "No Flutter tests are present yet."
          fi

      - name: Build debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_mode == 'debug' || inputs.build_mode == 'both' }}
        run: flutter build apk --debug --build-name=0.4.0 --build-number=${{ github.run_number }}

      - name: Build release APK for QA
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_mode == 'release' || inputs.build_mode == 'both' }}
        run: flutter build apk --release --build-name=0.4.0 --build-number=${{ github.run_number }}

      - name: Collect APKs and checksums
        if: always()
        shell: bash
        run: |
          mkdir -p dist
          find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' -exec cp {} dist/ \; 2>/dev/null || true
          if compgen -G 'dist/*.apk' > /dev/null; then
            (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          fi

      - name: Upload debug APK
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.build_mode == 'debug' || inputs.build_mode == 'both') }}
        uses: actions/upload-artifact@v4
        with:
          name: pour-toujours-debug-${{ github.run_number }}
          path: |
            dist/app-debug.apk
            dist/SHA256SUMS.txt
          retention-days: 14
          compression-level: 0

      - name: Upload release QA APK
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.build_mode == 'release' || inputs.build_mode == 'both') }}
        uses: actions/upload-artifact@v4
        with:
          name: pour-toujours-release-qa-${{ github.run_number }}
          path: |
            dist/app-release.apk
            dist/SHA256SUMS.txt
          retention-days: 14
          compression-level: 0
