name: Android V1 Release

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: APK build mode
        required: true
        default: both
        type: choice
        options: [debug, release, both]
  push:
    branches: [agent/initial-product-foundation]
    paths:
      - "lib/**"
      - "assets/**"
      - "android/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "CHANGELOG.md"
      - "RELEASE_NOTES.md"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-v1-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable
  JAVA_VERSION: "17"
  APP_VERSION: "1.0.0"

jobs:
  validate-and-build:
    name: Validate v1 and build signed QA APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Generate Android platform and native v1 integrations
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --org com.pourtoujours --project-name pour_toujours .
          fi
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path

          root = Path('android/app/src/main')
          manifest = root / 'AndroidManifest.xml'
          text = manifest.read_text(encoding='utf-8')
          manifest_root = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />',
          ]
          for permission in permissions:
              if permission not in text:
                  text = text.replace(manifest_root, manifest_root + '\n    ' + permission, 1)
          text = text.replace('android:label="pour_toujours"', 'android:label="Pour Toujours"')
          text = text.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/ic_pour_toujours"')

          receivers = '''
                  <receiver android:name=".PourToujoursSmallWidget" android:exported="true">
                      <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/pt_widget_small_info" />
                  </receiver>
                  <receiver android:name=".PourToujoursMediumWidget" android:exported="true">
                      <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/pt_widget_medium_info" />
                  </receiver>
                  <receiver android:name=".PourToujoursLargeWidget" android:exported="true">
                      <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/pt_widget_large_info" />
                  </receiver>
          '''
          if '.PourToujoursSmallWidget' not in text:
              text = text.replace('</application>', receivers + '\n    </application>', 1)
          manifest.write_text(text, encoding='utf-8')

          drawable = root / 'res/drawable'
          layout = root / 'res/layout'
          xml = root / 'res/xml'
          kotlin = root / 'kotlin/com/pourtoujours/pour_toujours'
          for directory in (drawable, layout, xml, kotlin):
              directory.mkdir(parents=True, exist_ok=True)

          (drawable / 'ic_pour_toujours.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#0A3033" android:pathData="M54,8A46,46 0,1 0,54 100A46,46 0,1 0,54 8"/>
            <path android:fillColor="#69B6AE" android:pathData="M54,20A34,34 0,1 0,54 88A34,34 0,1 0,54 20"/>
            <path android:fillColor="#0B3A43" android:pathData="M33,31L44,25L53,31L49,40L39,43L33,31M57,53L68,42L83,47L82,59L72,66L65,78L55,74L50,63L57,53M32,62L42,65L47,77L38,82L29,73L32,62"/>
            <path android:fillColor="#00000000" android:strokeColor="#F5F2E9" android:strokeWidth="5" android:strokeLineCap="round" android:pathData="M12,60C31,78 76,79 96,48"/>
            <path android:fillColor="#E8B64C" android:pathData="M82,18L85,25L92,28L85,31L82,38L79,31L72,28L79,25Z"/>
          </vector>''', encoding='utf-8')

          def widget_layout(name, title_id, body_ids):
              bodies = ''.join(f'<TextView android:id="@+id/{item}" android:layout_width="match_parent" android:layout_height="wrap_content" android:textColor="#DCEFED" android:textSize="13sp" android:maxLines="2" android:ellipsize="end" android:paddingTop="4dp" />' for item in body_ids)
              return f'''<?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:id="@+id/{name}_root" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:gravity="center_vertical" android:padding="16dp" android:background="#0A3033">
            <TextView android:id="@+id/{title_id}" android:layout_width="match_parent" android:layout_height="wrap_content" android:textColor="#FFFFFF" android:textSize="17sp" android:textStyle="bold" android:maxLines="2" android:ellipsize="end" />
            {bodies}
            <TextView android:id="@+id/{name}_updated" android:layout_width="match_parent" android:layout_height="wrap_content" android:textColor="#9AC7C2" android:textSize="10sp" android:paddingTop="6dp" />
          </LinearLayout>'''

          (layout / 'pt_widget_small.xml').write_text(widget_layout('small', 'small_title', ['small_body']), encoding='utf-8')
          (layout / 'pt_widget_medium.xml').write_text(widget_layout('medium', 'medium_title', ['medium_cities', 'medium_alert']), encoding='utf-8')
          (layout / 'pt_widget_large.xml').write_text(widget_layout('large', 'large_title', ['large_timeline', 'large_event', 'large_alert']), encoding='utf-8')

          def info(layout_name, width, height):
              return f'''<?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android" android:initialLayout="@layout/{layout_name}" android:minWidth="{width}dp" android:minHeight="{height}dp" android:resizeMode="horizontal|vertical" android:updatePeriodMillis="1800000" android:widgetCategory="home_screen" />'''
          (xml / 'pt_widget_small_info.xml').write_text(info('pt_widget_small', 110, 70), encoding='utf-8')
          (xml / 'pt_widget_medium_info.xml').write_text(info('pt_widget_medium', 250, 110), encoding='utf-8')
          (xml / 'pt_widget_large_info.xml').write_text(info('pt_widget_large', 250, 220), encoding='utf-8')

          provider = r'''package com.pourtoujours.pour_toujours

          import android.appwidget.AppWidgetManager
          import android.content.Context
          import android.content.SharedPreferences
          import android.widget.RemoteViews
          import es.antonborri.home_widget.HomeWidgetLaunchIntent
          import es.antonborri.home_widget.HomeWidgetProvider

          abstract class PourToujoursWidgetProvider(
              private val layoutId: Int,
              private val rootId: Int,
              private val bindings: List<Pair<Int, String>>,
              private val updatedId: Int,
          ) : HomeWidgetProvider() {
              override fun onUpdate(context: Context, manager: AppWidgetManager, ids: IntArray, data: SharedPreferences) {
                  ids.forEach { id ->
                      val views = RemoteViews(context.packageName, layoutId)
                      bindings.forEach { (view, key) ->
                          views.setTextViewText(view, data.getString(key, fallback(key)))
                      }
                      val stale = data.getString("pt_stale", "0") == "1"
                      views.setTextViewText(updatedId, if (stale) "Last known data · offline" else "Updated from city-level data")
                      views.setOnClickPendingIntent(rootId, HomeWidgetLaunchIntent.getActivity(context, MainActivity::class.java))
                      manager.updateAppWidget(id, views)
                  }
              }

              private fun fallback(key: String): String = when (key) {
                  "pt_primary" -> "Open Pour Toujours"
                  "pt_secondary" -> "Family context is available in the app"
                  "pt_cities" -> "Karachi · Chiba · Dublin · Hattiesburg"
                  "pt_timeline" -> "Shared overlap will appear after the app refreshes"
                  "pt_next_event" -> "No saved event"
                  "pt_alert" -> "No important alert"
                  else -> ""
              }
          }

          class PourToujoursSmallWidget : PourToujoursWidgetProvider(
              R.layout.pt_widget_small, R.id.small_root,
              listOf(R.id.small_title to "pt_primary", R.id.small_body to "pt_secondary"),
              R.id.small_updated,
          )

          class PourToujoursMediumWidget : PourToujoursWidgetProvider(
              R.layout.pt_widget_medium, R.id.medium_root,
              listOf(R.id.medium_title to "pt_primary", R.id.medium_cities to "pt_cities", R.id.medium_alert to "pt_alert"),
              R.id.medium_updated,
          )

          class PourToujoursLargeWidget : PourToujoursWidgetProvider(
              R.layout.pt_widget_large, R.id.large_root,
              listOf(R.id.large_title to "pt_primary", R.id.large_timeline to "pt_timeline", R.id.large_event to "pt_next_event", R.id.large_alert to "pt_alert"),
              R.id.large_updated,
          )
          '''
          (kotlin / 'PourToujoursWidgets.kt').write_text(provider, encoding='utf-8')
          PY

      - name: Install Flutter packages
        run: flutter pub get

      - name: Verify source formatting
        shell: bash
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib test

      - name: Strict static analysis
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Deterministic responsive and platform QA
        run: flutter test --reporter expanded

      - name: Verify release identity and native contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'android:label="Pour Toujours"' android/app/src/main/AndroidManifest.xml
          grep -F 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -F 'android.permission.POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml
          ! grep -F 'ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          ! grep -F 'ACCESS_COARSE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -F '.PourToujoursSmallWidget' android/app/src/main/AndroidManifest.xml
          grep -F '.PourToujoursMediumWidget' android/app/src/main/AndroidManifest.xml
          grep -F '.PourToujoursLargeWidget' android/app/src/main/AndroidManifest.xml
          grep -F 'version: 1.0.0+10' pubspec.yaml
          test -s assets/brand/pour_toujours_mark.svg
          test -s CHANGELOG.md
          test -s RELEASE_NOTES.md

      - name: Build debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_mode == 'debug' || inputs.build_mode == 'both' }}
        run: flutter build apk --debug --build-name=${{ env.APP_VERSION }} --build-number=${{ github.run_number }}

      - name: Build signed release QA APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_mode == 'release' || inputs.build_mode == 'both' }}
        run: flutter build apk --release --build-name=${{ env.APP_VERSION }} --build-number=${{ github.run_number }}

      - name: Verify APK signatures
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          for apk in build/app/outputs/flutter-apk/*.apk; do
            jarsigner -verify "$apk" >/dev/null
          done

      - name: Collect APKs checksums and metadata
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' -exec cp {} dist/ \; 2>/dev/null || true
          if compgen -G 'dist/*.apk' > /dev/null; then
            (cd dist && sha256sum *.apk > SHA256SUMS.txt)
            cat > dist/BUILD_METADATA.txt <<EOF
          app=Pour Toujours
          version=${APP_VERSION}
          run_number=${GITHUB_RUN_NUMBER}
          commit=${GITHUB_SHA}
          flutter=$(flutter --version | head -1)
          signing=QA signature; not a Play Store production key
          EOF
          else
            echo "No APK was produced because a required quality gate failed."
          fi

      - name: Upload debug APK
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.build_mode == 'debug' || inputs.build_mode == 'both') }}
        uses: actions/upload-artifact@v4
        with:
          name: pour-toujours-v1-debug-${{ github.run_number }}
          path: |
            dist/app-debug.apk
            dist/SHA256SUMS.txt
            dist/BUILD_METADATA.txt
          if-no-files-found: error
          retention-days: 21
          compression-level: 0

      - name: Upload signed release QA APK
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.build_mode == 'release' || inputs.build_mode == 'both') }}
        uses: actions/upload-artifact@v4
        with:
          name: pour-toujours-v1-release-qa-${{ github.run_number }}
          path: |
            dist/app-release.apk
            dist/SHA256SUMS.txt
            dist/BUILD_METADATA.txt
            CHANGELOG.md
            RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
