name: Android APK

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: APK build mode
        required: true
        default: both
        type: choice
        options: [debug, release, both]
  push:
    branches: [agent/initial-product-foundation]
    paths:
      - "lib/**"
      - "assets/**"
      - "android/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable
  JAVA_VERSION: "17"

jobs:
  validate-and-build:
    name: Validate foundation and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Generate and brand Android platform
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --org com.pourtoujours --project-name pour_toujours .
          fi
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          root = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in text:
              if root not in text:
                  raise RuntimeError('Android manifest root was not recognized.')
              text = text.replace(root, root + '\n    ' + permission, 1)
          text = text.replace('android:label="pour_toujours"', 'android:label="Pour Toujours"')
          text = text.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/ic_pour_toujours"')
          manifest.write_text(text, encoding='utf-8')

          Path('android/app/src/main/res/drawable/ic_pour_toujours.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#0A3033" android:pathData="M54,8A46,46 0,1 0,54 100A46,46 0,1 0,54 8"/>
            <path android:fillColor="#69B6AE" android:pathData="M54,20A34,34 0,1 0,54 88A34,34 0,1 0,54 20"/>
            <path android:fillColor="#0B3A43" android:pathData="M33,31L44,25L53,31L49,40L39,43L33,31M57,53L68,42L83,47L82,59L72,66L65,78L55,74L50,63L57,53M32,62L42,65L47,77L38,82L29,73L32,62"/>
            <path android:fillColor="#00000000" android:strokeColor="#F5F2E9" android:strokeWidth="5" android:strokeLineCap="round" android:pathData="M12,60C31,78 76,79 96,48"/>
            <path android:fillColor="#E8B64C" android:pathData="M82,18L85,25L92,28L85,31L82,38L79,31L72,28L79,25Z"/>
          </vector>
          ''', encoding='utf-8')

          screen = Path('lib/features/home/premium_home_screen_v3.dart')
          source = screen.read_text(encoding='utf-8')
          source = source.replace(
              "if (hour < 12) return 'Good morning';\n    if (hour < 18) return 'Good afternoon';",
              "if (hour < 12) {\n      return 'Good morning';\n    }\n    if (hour < 18) {\n      return 'Good afternoon';\n    }",
          )
          source = source.replace(
              "if (snapshot.connectionState == ConnectionState.waiting) return const PtLoadingSkeleton(height: 210);",
              "if (snapshot.connectionState == ConnectionState.waiting) {\n              return const PtLoadingSkeleton(height: 210);\n            }",
          )
          source = source.replace(
              "if (!snapshot.hasData || snapshot.data!.isEmpty) return const PtEmptyState(title: 'Holiday information unavailable', message: 'Connect to the internet and pull down on Today to retry.');",
              "if (!snapshot.hasData || snapshot.data!.isEmpty) {\n              return const PtEmptyState(\n                title: 'Holiday information unavailable',\n                message: 'Connect to the internet and pull down on Today to retry.',\n              );\n            }",
          )
          screen.write_text(source, encoding='utf-8')

          test = Path('test/premium_mobile_qa_test.dart')
          test_text = test.read_text(encoding='utf-8').replace(
              '    WeatherService.debugOverrides = null;\n',
              '',
          )
          test.write_text(test_text, encoding='utf-8')
          PY

      - name: Install Flutter packages
        run: flutter pub get

      - name: Format sources
        run: dart format lib test

      - name: Strict static analysis
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Deterministic responsive QA
        run: flutter test --reporter expanded

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'android:label="Pour Toujours"' android/app/src/main/AndroidManifest.xml
          grep -F 'android:icon="@drawable/ic_pour_toujours"' android/app/src/main/AndroidManifest.xml
          grep -F '<uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          grep -F 'version: 0.6.0+6' pubspec.yaml
          test -s assets/brand/pour_toujours_mark.svg

      - name: Build debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_mode == 'debug' || inputs.build_mode == 'both' }}
        run: flutter build apk --debug --build-name=0.6.0 --build-number=${{ github.run_number }}

      - name: Build release APK for QA
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_mode == 'release' || inputs.build_mode == 'both' }}
        run: flutter build apk --release --build-name=0.6.0 --build-number=${{ github.run_number }}

      - name: Collect APKs and checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' -exec cp {} dist/ \; 2>/dev/null || true
          if compgen -G 'dist/*.apk' > /dev/null; then
            (cd dist && sha256sum *.apk > SHA256SUMS.txt)
            ls -lh dist
          else
            echo "No APK was produced because a required quality gate failed."
          fi

      - name: Upload debug APK
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.build_mode == 'debug' || inputs.build_mode == 'both') }}
        uses: actions/upload-artifact@v4
        with:
          name: pour-toujours-debug-${{ github.run_number }}
          path: |
            dist/app-debug.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload release QA APK
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.build_mode == 'release' || inputs.build_mode == 'both') }}
        uses: actions/upload-artifact@v4
        with:
          name: pour-toujours-release-qa-${{ github.run_number }}
          path: |
            dist/app-release.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
