name: pour_toujours
description: A privacy-first family companion across time zones.
publish_to: "none"
version: 0.7.0+7

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  intl: ^0.20.1
  flutter_svg: ^2.0.16
  timezone: ^0.10.1
  shared_preferences: ^2.5.3
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/cities/
    - assets/licenses/
